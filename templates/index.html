{% extends "layout.html" %}

{% block body %}
    <div class="loader">
        <img src="{{ url_for('static', path='gifs/water-loader.gif') }}" alt="laoder">
        <div>loading...</div>
    </div>
    <div class="sub-body">
        <header>
            <div>
                <!-- <img src="{{ url_for('static', path='images/right-arrow.png') }}" alt="arrow-logo"> -->
            </div>
        </header>
        <main>
            <input type="checkbox" id="check-menu">
            <label for="check-menu">
                <img class="arrow-right" src="{{ url_for('static', path='images/right-arrow.png') }}" alt="arrow-logo">
            </label>
            <div class="block-1">
                <div class="above-menu">
                    <div class="logo-cont">
                        <div class="logo">
                            <img src="{{ url_for('static', path='images/steve-logo.png') }}" alt="logo">
                        </div>
                        <div class="logo-text">
                            <h2>Steve</h2>
                            <div>Your AI Chef</div>
                        </div>
                    </div>
                    <label for="check-menu">
                        <img class="arrow" src="{{ url_for('static', path='images/left-arrow.png') }}" alt="arrow-logo">
                    </label>
                </div>
                <menu>
                    <div class="item selected">
                        <img src="{{ url_for('static', path='images/home.png') }}" alt="home">
                        <div>Home</div>
                    </div>
                    <div class="item">
                        <img src="{{ url_for('static', path='images/love.png') }}" alt="favorites">
                        <div>Favorites</div>
                    </div>
                    <div class="item">
                        <img src="{{ url_for('static', path='images/calender.png') }}" alt="favorites">
                        <div>Meal Planner</div>
                    </div>
                    <div class="item">
                        <img src="{{ url_for('static', path='images/time.png') }}" alt="history">
                        <div>History</div>
                    </div>
                </menu>
            </div>
            <div class="block-2">
                
            </div>
        </main>
    </div>

{% endblock %}
