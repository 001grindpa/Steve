<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="initial-scale=1.0, width=device-width">
        <meta property="og:description" content="Steve is your interactive cook AI agent that figures out what delicious dish you can make with what you have.">
        <link rel="stylesheet" href="{{ url_for('static', path='css/steve.css') }}">
        <script src="{{ url_for('static', path='js/steve.js') }}"></script>
        <title>Steve: your chef assistant</title>
        <style>
            main .section-cont {
                background: url("{{ url_for('static', path='images/steve-hero.png') }}");
                background-repeat: no-repeat;
                background-size: cover;
            }
            .block-2 .chat-area {
                background-image: url("{{ url_for('static', path='images/steve-chat-bg-mobile.png') }}");
                background-repeat: no-repeat;
                background-size: 100% 100%;
            }
            footer {
                background: url("{{ url_for('static', path='images/steve-chat-bg-2.png') }}");
                background-repeat: no-repeat;
                background-size: cover;
            }
            #planner .block-3 .content {
                background: url("{{ url_for('static', path='images/date-bg-cut.png') }}");
                background-repeat: no-repeat;
                background-size: cover;
            }
            #planner .block-3 .content-2 .add-meal-cont:nth-child(1) {
                background: url("{{ url_for('static', path='images/morning_bg.png') }}");
                background-repeat: no-repeat;
                background-size: cover;
            }
            #planner .block-3 .content-2 .add-meal-cont:nth-child(2) {
                background: url("{{ url_for('static', path='images/afternoon_bg.png') }}");
                background-repeat: no-repeat;
                background-size: cover;
            }
            #planner .block-3 .content-2 .add-meal-cont:nth-child(3) {
                background: url("{{ url_for('static', path='images/evening_bg.png') }}");
                background-repeat: no-repeat;
                background-size: cover;
            }
            /* rearrange layout */
            @media(min-width: 366px) {
                .block-2 .chat-area {
                    background-image: url("{{ url_for('static', path='images/steve-chat-bg-2.png') }}");
                    background-size: cover;
                    background-repeat: no-repeat;
                }
            }
        </style>
    </head>
    <body id="{{ page_id }}">
        {% block body %}{% endblock %}
    </body>
</html>
