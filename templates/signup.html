{% extends "layout.html" %}

{% block body %}

<div> <!--class="sub-body"-->
    <header>
        <div class="sub-header-cont">
            <div class="sub-header">
                <div class="logo">
                    <img src="{{ url_for('static', path='images/steve-logo.png') }}" alt="logo">
                </div>
                <div class="logo-text">
                    <h2>Steve</h2>
                    <div>Your AI Chef</div>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="section-container">
            <h1>Start cooking smarter with Steve</h1>
            <div>get personalized recipes from ingredients you already have.</div>
            <a href="" id="google-login"><img src="{{ url_for('static', path='images/google.png') }}" alt="google_logo"><div>Continue with Google</div></a>
            <div class="or">
                <div class="line"></div>
                <div>or</div>
                <div class="line"></div>
            </div>
            <form action="">
                <div><img src="{{ url_for('static', path='images/email.png') }}" alt="mail_logo"><input type="text" name="email" placeholder="Email address" autofocus autocomplete="off"></div>
                <div><img src="{{ url_for('static', path='images/lock.png') }}" alt="lock_logo"><input type="password" name="pw" placeholder="Password" autocomplete="off"><img src="{{ url_for('static', path='images/opened-eye.png') }}" alt="eye_logo"></div>
                <input type="password" name="confirm_pw" placeholder="Confirm" autocomplete="off">
                <button>Create Account</button>
            </form>
        </div>
    </main>
</div>

{% endblock %}
